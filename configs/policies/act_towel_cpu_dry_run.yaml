# One synthetic ACT step on CPU. Same 12-DoF / three-camera contract as the GPU
# run, but 64x64 images and a tiny transformer so CI can execute it. Re-launch
# the same output directory to resume from checkpoints/last.
dataset_repo_id: humjie/bimanual-so101-fold-towel
dataset_root: null
revision: null
job_name: act_towel_cpu_dry_run
output_dir: outputs/train/act_towel_cpu_dry_run
device: cpu
dry_run: true
seed: 0
batch_size: 2
steps: 1
num_workers: 0
log_freq: 1
save_freq: 1
save_checkpoint: true
resume: auto
push_to_hub: false
use_amp: false
wandb:
  enable: false
  project: cortex-reflex
  entity: null
  mode: null
  run_id: null
policy:
  chunk_size: 4
  n_action_steps: 4
  dim_model: 64
  n_heads: 4
  dim_feedforward: 128
  n_encoder_layers: 1
  n_decoder_layers: 1
  use_vae: false
  latent_dim: 32
  n_vae_encoder_layers: 4
  dropout: 0.1
  kl_weight: 10.0
  vision_backbone: resnet18
  pretrained_backbone_weights: null
  optimizer_lr: 1.0e-5
  optimizer_weight_decay: 1.0e-4
  optimizer_lr_backbone: 1.0e-5
cameras:
  - observation.images.left
  - observation.images.right
  - observation.images.top
action_dim: 12
image_height: 64
image_width: 64
