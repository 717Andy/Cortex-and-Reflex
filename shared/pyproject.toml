[project]
name = "shared"
version = "0.1.0"
description = "Schemas, sim, teleop, and eval contracts shared by Cortex and Reflex."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
